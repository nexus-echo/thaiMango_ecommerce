<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" fill="none" stroke="#B47404" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Fermentation doodles, tiled faintly behind the "Our Very Slow
       Fermentation Process" section (companion to the Why Choose
       process-doodles.svg). Namwa banana → cultures → slow fermentation →
       transformed mango → flavor, with scribbled words. No health claims. -->

  <!-- Namwa banana bunch: three fanned bananas from one crown -->
  <path d="M48 56C46 96 84 126 136 122L141 117C96 116 64 94 58 56Z"/>
  <path d="M52 52C60 92 100 114 150 102L153 96C110 102 76 86 62 50Z"/>
  <path d="M56 48C74 82 116 92 158 74L159 68C120 82 88 74 66 44Z"/>
  <path d="M64 80C74 96 92 106 112 110M72 70C86 82 104 88 124 88" stroke-width="1.4"/>
  <path d="M50 52L44 36M40 36H52"/>
  <!-- banana slices -->
  <circle cx="186" cy="132" r="14"/>
  <circle cx="186" cy="132" r="5" stroke-width="1.6"/>
  <circle cx="214" cy="146" r="11"/>
  <circle cx="214" cy="146" r="4" stroke-width="1.6"/>

  <!-- dashed path → tank -->
  <path d="M170 60c50-30 96-26 136-4" stroke-dasharray="3 8"/>
  <path d="M298 48l10 9-13 4"/>

  <!-- fermentation tank with sight glass and bubbles -->
  <path d="M318 62a14 14 0 0 1 14-14h40a14 14 0 0 1 14 14v70a8 8 0 0 1-8 8h-52a8 8 0 0 1-8-8z"/>
  <path d="M340 48v-10h24v10M352 38v-8"/>
  <rect x="362" y="64" width="12" height="54" rx="6" stroke-width="1.8"/>
  <circle cx="368" cy="104" r="2" stroke-width="1.4"/>
  <circle cx="366" cy="90" r="1.6" stroke-width="1.4"/>
  <circle cx="370" cy="78" r="1.3" stroke-width="1.4"/>
  <path d="M328 140v14M376 140v14M322 154h12M370 154h12"/>
  <path d="M318 84h-14v14" stroke-width="1.8"/>
  <!-- rising bubbles -->
  <circle cx="412" cy="44" r="7"/>
  <circle cx="430" cy="24" r="4.5"/>
  <circle cx="404" cy="18" r="3"/>
  <circle cx="440" cy="52" r="2.5"/>

  <!-- microbes: rod bacteria with flagella, cocci chain -->
  <rect x="462" y="112" width="44" height="16" rx="8" transform="rotate(-18 484 120)"/>
  <path d="M506 106c8-4 10 4 18 0M463 134c-8 4-10-4-18 0" stroke-width="1.6"/>
  <rect x="478" y="168" width="36" height="14" rx="7" transform="rotate(24 496 175)"/>
  <circle cx="428" cy="206" r="7"/><circle cx="442" cy="212" r="7"/><circle cx="456" cy="216" r="7"/>
  <circle cx="484" cy="232" r="9"/>
  <circle cx="482" cy="230" r="2" fill="#B47404" stroke="none"/>

  <!-- Erlenmeyer flask -->
  <path d="M64 232v26l-24 44a8 8 0 0 0 7 12h58a8 8 0 0 0 7-12l-24-44v-26"/>
  <path d="M58 232h36"/>
  <path d="M50 286q13-6 26 0t26 0" stroke-width="1.8"/>
  <circle cx="68" cy="298" r="3" stroke-width="1.5"/>
  <circle cx="84" cy="304" r="2.2" stroke-width="1.5"/>
  <circle cx="76" cy="270" r="2" stroke-width="1.5"/>

  <!-- petri dish with colonies -->
  <ellipse cx="226" cy="314" rx="44" ry="18"/>
  <ellipse cx="226" cy="310" rx="44" ry="18" stroke-width="1.6"/>
  <circle cx="210" cy="308" r="3.5" stroke-width="1.6"/>
  <circle cx="232" cy="304" r="5" stroke-width="1.6"/>
  <circle cx="246" cy="314" r="2.5" stroke-width="1.6"/>
  <circle cx="222" cy="318" r="2" stroke-width="1.6"/>

  <!-- mango slice → dashed arrow → dried strip -->
  <path d="M332 286c-6 14 2 32 18 36 10-12 6-32-18-36z"/>
  <path d="M338 296c2 8 6 14 10 18" stroke-width="1.5"/>
  <path d="M368 304h34" stroke-dasharray="3 7"/>
  <path d="M396 298l8 6-8 6"/>
  <path d="M416 318c10-22 26-30 40-26 6 10-2 24-18 30-8 3-16 1-22-4z"/>
  <path d="M424 314c8-8 16-14 26-16" stroke-width="1.5"/>

  <!-- droplet + leaf -->
  <path d="M500 374c-6 9-14 18-14 27a14 14 0 0 0 28 0c0-9-8-18-14-27z"/>
  <path d="M494 400v3a6 6 0 0 0 6 6" stroke-width="1.8"/>
  <path d="M514 384c-2-12 4-20 16-22 2 12-4 20-16 22z"/>

  <!-- hourglass: very slow -->
  <path d="M104 406h36M104 470h36M110 406c0 16 22 20 22 32s-22 16-22 32M134 406c0 16-22 20-22 32s22 16 22 32"/>
  <path d="M116 462q6-8 12 0z" fill="#B47404" stroke-width="1.2"/>

  <!-- ripe mango with leaf -->
  <path d="M322 468c-14-2-24 12-20 26 4 14 22 18 32 8 10-10 6-32-12-34z"/>
  <path d="M324 468c6-12 18-16 28-12-6 10-16 14-28 12z"/>
  <path d="M312 486c2 6 6 10 12 12" stroke-width="1.5"/>
  <!-- sparkles -->
  <path d="M260 40v12M254 46h12M540 300v10M535 305h10M190 400v8M186 404h8M470 470v10M465 475h10M30 430v10M25 435h10" stroke-width="1.8"/>

  <!-- scribbled words -->
  <g fill="#B47404" stroke="none" font-family="'Segoe Script','Bradley Hand','Brush Script MT','Comic Sans MS',cursive" font-size="22">
    <text x="196" y="100" transform="rotate(-6 196 100)">ferment</text>
    <text x="214" y="122" font-size="14" transform="rotate(-6 214 122)">slowly…</text>
    <text x="30" y="178" font-size="15" transform="rotate(-8 30 178)">Namwa banana</text>
    <text x="372" y="262" font-size="17" transform="rotate(5 372 262)">living cultures</text>
    <text x="378" y="424" font-size="19" transform="rotate(6 378 424)">then we dry</text>
    <text x="150" y="534" font-size="18" transform="rotate(-4 150 534)">we transform first</text>
    <text x="400" y="534" font-size="16" transform="rotate(-3 400 534)">flavor deepens</text>
    <text x="20" y="372" font-size="22" font-family="'Leelawadee UI','Tahoma',sans-serif" transform="rotate(-5 20 372)">หมัก</text>
  </g>
</svg>
