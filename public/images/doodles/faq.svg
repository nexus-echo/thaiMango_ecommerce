<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" fill="none" stroke="#B47404" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- FAQ doodles (question marks, lightbulb, magnifier, book, info),
       tiled behind the FAQ body via DoodleBackdrop. -->

  <!-- question mark -->
  <path d="M50 70c0-18 13-30 29-30s29 12 29 27c0 20-27 22-27 42"/>
  <circle cx="81" cy="128" r="3.5" fill="#B47404"/>

  <!-- lightbulb -->
  <path d="M300 96c-16-12-18-40 0-54 16-12 40-6 46 14 5 16-4 28-12 38v14h-26z"/>
  <path d="M308 116h26M310 126h22"/>
  <path d="M320 18v-8M286 34l-6-6M354 34l6-6M270 64h-8M370 64h8" stroke-width="1.6"/>

  <!-- dashed thought trail -->
  <path d="M130 90c40 20 90 10 140-10" stroke-dasharray="3 8"/>

  <!-- magnifier -->
  <circle cx="450" cy="160" r="26"/>
  <path d="M469 179l24 24"/>
  <path d="M438 150c4-6 10-8 16-7" stroke-width="1.6"/>

  <!-- open book -->
  <path d="M70 250c20-10 44-10 64 4 20-14 44-14 64-4v70c-20-10-44-10-64 4-20-14-44-14-64-4z"/>
  <path d="M134 254v70"/>
  <path d="M84 270c12-4 24-4 36 2M84 286c12-4 24-4 36 2M148 272c12-6 24-6 36-2M148 288c12-6 24-6 36-2" stroke-width="1.6"/>

  <!-- info circle -->
  <circle cx="290" cy="250" r="24"/>
  <path d="M290 244v20"/>
  <circle cx="290" cy="236" r="2.5" fill="#B47404"/>

  <!-- chat bubble with ? -->
  <path d="M390 280h80a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14h-46l-20 16v-16h-14a14 14 0 0 1-14-14v-34a14 14 0 0 1 14-14z"/>
  <path d="M420 300c0-6 5-10 10-10s10 4 10 9c0 7-10 8-10 15"/>
  <circle cx="430" cy="324" r="2" fill="#B47404"/>

  <!-- small question mark, tilted -->
  <g transform="rotate(14 230 420)">
    <path d="M216 404c0-10 8-17 16-17s16 7 16 15c0 12-15 12-15 24"/>
    <circle cx="233" cy="438" r="2.5" fill="#B47404"/>
  </g>

  <!-- tick in circle -->
  <circle cx="90" cy="440" r="22"/>
  <path d="M80 440l7 8 14-16"/>

  <!-- sparkles + squiggle -->
  <path d="M360 430c2 12 5 15 17 17-12 2-15 5-17 17-2-12-5-15-17-17 12-2 15-5 17-17z"/>
  <path d="M200 170v12M194 176h12M480 440v12M474 446h12" stroke-width="1.6"/>
  <path d="M420 490c6-8 14-8 20 0s14 8 20 0" stroke-width="1.8"/>
  <circle cx="30" cy="190" r="3" fill="#B47404"/>
  <circle cx="44" cy="204" r="2" fill="#B47404"/>
</svg>
