  <circle cx="356" cy="299" r="5" fill="#FFE490"/>
  <circle cx="410" cy="274" r="4" fill="#FFE490"/>
  <circle cx="444" cy="289" r="4.5" fill="#FFE490"/>

  <!-- bubble letters: HI! -->
  <g transform="rotate(-8 110 340)" fill="#ECA40C" fill-opacity="0.35">
    <path d="M40 300h22v26h18v-26h22v78h-22v-30h-18v30h-22z"/>
    <path d="M114 300h22v78h-22z"/>
    <path d="M150 300h22l-4 52h-14z"/>
    <circle cx="161" cy="370" r="8"/>
  </g>

  <!-- speech bubble -->
  <path d="M204 400h90a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14h-50l-20 18v-18h-20a14 14 0 0 1-14-14v-36a14 14 0 0 1 14-14z"/>
  <circle cx="230" cy="432" r="4" fill="#FFE490"/>
  <circle cx="249" cy="432" r="4" fill="#FFE490"/>
  <circle cx="268" cy="432" r="4" fill="#FFE490"/>

  <!-- spray splatter -->
  <g fill="#ECA40C" stroke="none">
    <circle cx="420" cy="400" r="10"/>
    <circle cx="442" cy="386" r="4"/>
    <circle cx="404" cy="420" r="3"/>
    <circle cx="450" cy="412" r="2.5"/>
    <circle cx="430" cy="428" r="5"/>
    <circle cx="410" cy="384" r="2"/>
    <circle cx="458" cy="396" r="1.8"/>
    <circle cx="396" cy="404" r="1.6"/>
    <circle cx="150" cy="60" r="6"/>
    <circle cx="136" cy="48" r="2.5"/>
    <circle cx="164" cy="70" r="2"/>
    <circle cx="140" cy="74" r="1.8"/>
