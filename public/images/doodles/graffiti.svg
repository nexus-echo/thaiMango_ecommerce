<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none" stroke="#FFE490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Street-graffiti tile for the contact hero (burgundy): heavier strokes
       than the doodle tiles, spray splatter, paint drips, a tag crown and
       bubble letters. Gold outlines, mango fills. -->

  <!-- curved arrow -->
  <path d="M60 120c40-60 120-60 150-10" stroke-width="4"/>
  <path d="M196 94l14 16-20 6" stroke-width="4"/>

  <!-- tag crown -->
  <path d="M300 120l10-40 22 28 18-36 18 36 22-28 10 40z" fill="#ECA40C" fill-opacity="0.35"/>
  <circle cx="310" cy="72" r="5" fill="#ECA40C"/>
  <circle cx="350" cy="36" r="5" fill="#ECA40C"/>
  <circle cx="390" cy="72" r="5" fill="#ECA40C"/>

  <!-- zigzag -->
  <path d="M170 30l14 16 14-16 14 16 14-16 14 16"/>

  <!-- x marks -->
  <path d="M452 36l16 16M468 36l-16 16"/>
  <path d="M24 440l14 14M38 440l-14 14"/>

  <!-- starburst -->
  <path d="M90 180v40M70 200h40M76 186l28 28M104 186l-28 28"/>

  <!-- heart -->
  <path d="M250 200c-6-12-26-8-22 8 3 10 22 22 22 22s19-12 22-22c4-16-16-20-22-8z"/>

  <!-- paint drips -->
