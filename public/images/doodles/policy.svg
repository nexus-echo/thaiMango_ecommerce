  <path d="M344 40v24h24"/>
  <path d="M304 84h48M304 100h48M304 116h32" stroke-width="1.6"/>

  <!-- padlock -->
  <rect x="436" y="120" width="52" height="42" rx="8"/>
  <path d="M446 120v-14a16 16 0 0 1 32 0v14"/>
  <circle cx="462" cy="138" r="4"/>
  <path d="M462 142v8"/>

  <!-- signature scribble -->
