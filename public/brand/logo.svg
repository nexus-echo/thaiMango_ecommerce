<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 248" role="img" aria-labelledby="bm-title">
  <title id="bm-title">Bangkok Mango — Taste of Thailand</title>
  <defs>
    <!-- Deep gold of the emblem printed on the packs -->
    <linearGradient id="bm-gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200">
      <stop offset="0" stop-color="#F2B830"/>
      <stop offset="1" stop-color="#B47A06"/>
    </linearGradient>

    <!-- Temple emblem traced from the packaging (e.g. the Ginger pack):
         central stepped prang, flanking chedi spires, upturned finials and a
         long tapered base, with a lotus in an ogee arch. Drawn as the right
         half around x=0, then mirrored. Emblem box: 424 x 200. -->
    <g id="bm-half" fill="url(#bm-gold)">
      <polygon points="0,7 2.5,28 5,40 8,44 8,52 11,56 12,66 15,70 17,80 20,84 23,94 26,98 29,108 32,112 35,122 38,126 42,137 42,160 0,160"/>
      <polygon points="0,137 42,137 52,147 95,147 108,160 130,172 150,180 190,190 212,195 0,198"/>
      <polygon points="0,192 214,194.5 217,195.5 214,196.5 0,199"/>
      <path d="M42 92Q44 125 47 145H37Q40 125 42 92Z"/>
      <path d="M65 72Q67 100 72 121L74 123V126Q77 140 80 147H50Q53 140 56 126V123L58 121Q63 100 65 72Z"/>
      <path d="M84 127Q86 142 90 150H78Q82 142 84 127Z"/>
      <path d="M112 148Q113 158 116 165H108Q111 158 112 148Z"/>
      <path d="M139 156L141.5 166H136.5Z"/>
      <circle cx="139" cy="171" r="4"/>
      <path d="M133 182Q139 174 145 182Z"/>
      <path d="M158 123Q160 165 168 184H148Q156 165 158 123Z"/>
      <path d="M177 158L179.8 165H174.2Z"/>
      <circle cx="177" cy="170.5" r="5.2" fill="none" stroke="url(#bm-gold)" stroke-width="2.6"/>
      <path d="M177 176Q176.5 185 170 191" fill="none" stroke="url(#bm-gold)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Knock the arch and the prang's small oval window out of the gold -->
    <mask id="bm-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="424" height="200">
      <rect width="424" height="200" fill="#fff"/>
      <path fill="#000" d="M212 132C218 140 228 144 234 152C242 160 249 172 249 191H175C175 172 182 160 190 152C196 144 206 140 212 132Z"/>
      <ellipse fill="#000" cx="212" cy="110" rx="2.6" ry="4.2"/>
    </mask>

    <g id="bm-emblem">
      <g mask="url(#bm-cut)">
        <use href="#bm-half" transform="translate(212 0)"/>
        <use href="#bm-half" transform="translate(212 0) scale(-1 1)"/>
      </g>
      <!-- Lotus in the arch -->
      <g fill="none" stroke="#C0840C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M212 150C221 160 224 172 212 187C200 172 203 160 212 150Z"/>
        <path d="M212 187C220 170 234 163 243 172C249 180 240 188 212 187"/>
        <path d="M212 187C204 170 190 163 181 172C175 180 184 188 212 187"/>
        <path d="M181 189.5H243"/>
      </g>
      <circle cx="212" cy="176" r="1.8" fill="#C0840C"/>
    </g>
  </defs>

  <use href="#bm-emblem" transform="translate(104 8) scale(0.5)"/>

  <!-- Wordmark: bold serif set tight at natural width (MANGO is narrower
       than BANGKOK), as on the pack -->
  <text x="210" y="158" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="54" font-weight="700" fill="#0A0A0A">BANGKOK</text>
  <text x="210" y="208" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="54" font-weight="700" fill="#0A0A0A">MANGO</text>

  <!-- Script tagline with flanking rules, as on the pack -->
  <line x1="48" y1="232" x2="104" y2="232" stroke="#B47404" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="316" y1="232" x2="372" y2="232" stroke="#B47404" stroke-width="1.6" stroke-linecap="round"/>
  <text x="210" y="239" text-anchor="middle"
        font-family="'Segoe Script', 'Brush Script MT', 'Snell Roundhand', cursive"
        font-size="19" fill="#935400">Taste of Thailand</text>
</svg>